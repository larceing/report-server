# Comprueba el código y, en cada push a main o release publicada, construye la
# imagen y la sube a GHCR (ghcr.io/larceing/report-server:sha-xxxxxxx). Desplegarla la
# hace el servidor DEV/PRO desde Ajustes (servidor.json, tipo "servidor").
name: Imagen

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: servidor.json es JSON válido
        run: node -e "JSON.parse(require('fs').readFileSync('servidor.json', 'utf8'))"
      - name: sintaxis
        run: for f in server.js src/*.js public/js/*.js tests/*.js; do node --check "$f"; done
      - name: pruebas
        run: npm test

  # En cada PR: la imagen se construye y saca un PDF de verdad con LibreOffice.
  imagen-prueba:
    needs: comprobar
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t report-server:prueba .
      - name: arranca y genera el PDF de ejemplo
        run: |
          docker run -d --name rs -p 3000:3000 -e NODE_ENV=development report-server:prueba
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/version/ && break; sleep 1; done
          curl -sf -o ejemplo.pdf -X POST http://127.0.0.1:3000/api/admin/probar \
            -H 'Content-Type: application/json' \
            -d "{\"plantilla\":\"ejemplo\",\"formato\":\"pdf\",\"datos\":$(cat ejemplos/ejemplo.json)}"
          head -c 5 ejemplo.pdf | grep -q '%PDF-'
          ls -l ejemplo.pdf
          docker stats --no-stream rs
      - if: failure()
        run: docker logs rs

  imagen:
    needs: comprobar
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "extra=latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "extra=main" >> "$GITHUB_OUTPUT"
          fi
          echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.imagen }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.imagen }}:${{ steps.v.outputs.extra }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
